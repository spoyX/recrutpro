server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular client-side routing: unknown paths must return index.html,
  # not 404, or a deep link like /candidates/123 breaks on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # environment.ts (production) uses the relative base path /api/v1,
  # so nginx proxies it to the backend container.
  #
  # proxy_pass MUST go through a variable. With a literal hostname nginx
  # resolves it at config-load time and refuses to start when the backend
  # is down ([emerg] host not found in upstream) — which would take static
  # file serving down with it. Via a variable, resolution happens per
  # request through Docker's embedded DNS, so the SPA keeps serving and
  # only /api/ returns 502 while the backend is unavailable.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
