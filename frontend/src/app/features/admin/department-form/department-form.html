<div class="modal" role="dialog" aria-modal="true" aria-labelledby="department-form-title">
  <div class="modal__panel">
    <h2 id="department-form-title" class="modal__title">
      @if (isRename()) {
        Renommer le département
      } @else {
        Nouveau département
      }
    </h2>

    @if (isRename()) {
      <p class="modal__body">
        Les comptes et les postes déjà rattachés suivent le nouveau nom : le
        département reste le même.
      </p>
    }

    <div class="modal__field">
      <label class="modal__label label-sm" for="department-name">Nom</label>
      <input
        id="department-name"
        class="modal__input"
        type="text"
        [disabled]="busy()"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </div>

    @if (errorMessage(); as message) {
      <p class="modal__error" role="alert">{{ message }}</p>
    }

    <div class="modal__actions">
      <button matButton type="button" [disabled]="busy()" (click)="dismissed.emit()">
        Annuler
      </button>
      <button matButton="filled" type="button" [disabled]="!canSubmit()" (click)="submit()">
        @if (isRename()) {
          Renommer
        } @else {
          Créer
        }
      </button>
    </div>
  </div>
</div>
